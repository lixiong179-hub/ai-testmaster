# Alembic migration configuration
# Keeps schema history manageable on local and CI environments.

[alembic]
# Script location
script_location = alembic

# Revision filename template
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Add project root to sys.path
prepend_sys_path = .

# Version path handling
version_path_separator = os

# Database URL is injected from app settings
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Optional formatter hook for generated revisions
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 100 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
