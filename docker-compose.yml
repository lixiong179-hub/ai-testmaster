version: '3.8'

services:
  # -------------------- MySQL 8.0 --------------------
  # 安全收紧：移除弱密码默认值（rootpassword/aitest123），强制通过 .env 注入强密码。
  # 未配置环境变量时容器将拒绝启动，避免生产环境误用弱凭据。
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_testmaster}
      MYSQL_USER: ${MYSQL_USER:-aitest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # -------------------- Redis 7 --------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # -------------------- 后端服务 --------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - APP_NAME=${APP_NAME:-AI测试平台}
      - DEBUG=${DEBUG:-false}
      # 数据库（Docker 内部网络使用 aiomysql 驱动）
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-aitest}:${MYSQL_PASSWORD:-aitest123}@mysql:3306/${MYSQL_DATABASE:-ai_testmaster}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-20}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      # Redis
      - REDIS_URL=redis://redis:6379/0
      - REDIS_MAX_CONNECTIONS=${REDIS_MAX_CONNECTIONS:-50}
      # JWT
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # 加密
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ENCRYPTION_SALT=${ENCRYPTION_SALT}
      # 管理员
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      # AI 配置
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.deepseek.com}
      - AI_MODEL_NAME=${AI_MODEL_NAME:-deepseek-v4-flash}
      - AI_FALLBACK_MODEL_NAME=${AI_FALLBACK_MODEL_NAME:-deepseek-v4-flash}
      # 视觉模型
      - VISION_MODEL_DEFAULT=${VISION_MODEL_DEFAULT:-qwen}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - BAIDU_API_KEY=${BAIDU_API_KEY:-}
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
      # AI 自愈
      - AI_SELF_HEALING_ENABLED=${AI_SELF_HEALING_ENABLED:-true}
      - BROWSERBASE_API_KEY=${BROWSERBASE_API_KEY:-}
      - BROWSERBASE_PROJECT_ID=${BROWSERBASE_PROJECT_ID:-}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      # 日志
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload_data:/app/uploads
    restart: unless-stopped

  # -------------------- Nginx 反向代理 --------------------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  upload_data:
