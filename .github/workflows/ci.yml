name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── 门禁分层（2026-09-24 R5-3 建立；2026-11-12 B-09 收口）──
  # 【必阻断】本文件全部 4 个 job（失败即阻断合入）：
  #   backend-test        —— ruff lint/format 门禁 + alembic 迁移校验 + 子集 pytest + 覆盖率 ≥80%
  #   backend-full        —— 全量测试 4 分片（matrix，check 名为 "backend-full (shard N/4)"）
  #   compose-config      —— 部署编排静态校验
  #   frontend-build      —— ESLint + vue-tsc + build + vitest
  # 【提示类】不阻断，位于独立 workflow（等价于 continue-on-error，B-09 已据此修订判据文字）：
  #   daily-regression.yml 的 full-regression（仅 schedule）
  #   security-scan.yml 的 python-dependencies / npm-audit / secret-scan
  #   docker-publish.yml 的 build-and-push（tag 触发）
  # 🤝 人工项：Branch protection 需在 Settings → Branches 勾选上面 4 类共 8 个 check 名，
  #    勾选清单见《架构优化执行计划清单》R5-3 条目「🤝 人工项」表。
  # 【必阻断】backend-test：
  backend-test:
    # 钉 24.04：`ubuntu-latest` 已滚动到 26.04，而 Playwright 尚不支持
    # `chromium on ubuntu26.04-x64`，`playwright install` 会直接失败（B-05 修复）
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_pw
          # 应用库（与本地 .env 语义一致）；测试库由 Init 步骤创建 —— 多个用例用
          # `settings.DATABASE_URL.replace("/ai_testmaster", "/ai_testmaster_test")` 推导测试库，
          # 若 DATABASE_URL 直接指向 _test 会拼出 `..._test_test`（1049 Unknown database）
          MYSQL_DATABASE: ai_testmaster
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        # 限流 / 缓存 / SSE 用例依赖真实 Redis；缺失时会 ConnectionRefused (6379) 批量失败
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # ruff 钉版本：`ruff format --check` 的产出随 fmt 风格演进变化，浮动版本会让全量 PR 无故变红
          pip install pytest pytest-cov pytest-asyncio pytest-split ruff==0.15.17 mypy
      - name: Install Playwright browsers
        # 浏览器控制器用例需要 chromium；缺失时报 "Executable doesn't exist ... chrome-headless-shell"
        run: playwright install --with-deps chromium
      - name: Init test database
        env:
          MYSQL_PWD: test_root_pw
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -e "
            CREATE DATABASE IF NOT EXISTS ai_testmaster_test
              CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            GRANT ALL PRIVILEGES ON ai_testmaster_test.* TO 'test_user'@'%';
            FLUSH PRIVILEGES;"
      - name: Ruff lint
        run: ruff check app
      - name: Ruff format check
        # B-15（2026-11-18）：app 已全量 format 归零，此处做棘轮防回潮。
        # 只查 app（与 `ruff check app` 同口径）；tests/scripts 虽已格式化，暂不入门禁以免误伤历史 PR。
        # alembic/versions 有意不格式化（冻结迁移历史），故不能用全仓 `ruff format --check .`
        run: ruff format --check app
      - name: C901 complexity gate
        # G-8（2026-11-18 立项）：C901 长期全局豁免，立项实测 150 处 / 129 文件。
        # 棘轮：总量只减不增 + 豁免 ≤5 且须实存（见脚本 WHITELIST，审批标准 = 策略页 §4）
        run: python scripts/check_c901_budget.py
      - name: AsyncSession convergence gate
        # R2-1 已结项（2026-11-17）：async_get_db 使用面 0，仅余 app/db/database/ 定义与再导出；
        # 白名单只减不增，任何端点/服务新增 async_get_db 即失败（预算见 scripts/check_async_session_convergence.py）
        run: python scripts/check_async_session_convergence.py
      - name: Alembic migrations
        # 应用库与测试库都要建到 head：部分遗留用例直连应用库（PrimarySessionLocal），
        # 测试库供 conftest / TEST_DATABASE_URL 使用。
        run: |
          DATABASE_URL=mysql+pymysql://test_user:test_pw@127.0.0.1:3306/ai_testmaster \
            alembic upgrade head
          DATABASE_URL=mysql+pymysql://test_user:test_pw@127.0.0.1:3306/ai_testmaster_test \
            alembic upgrade head
      - name: Seed default user
        # 部分遗留用例硬编码 user_id=1 / created_by=1（projects_ibfk_2 等外键），
        # CI 库为空会 1452；这里在两库各补一条 id=1 的占位用户。
        env:
          MYSQL_PWD: test_root_pw
        run: |
          for db in ai_testmaster ai_testmaster_test; do
            mysql -h 127.0.0.1 -P 3306 -u root "$db" -e "
              INSERT INTO users (id, username, email, password_hash, is_active, is_superuser,
                                 failed_login_attempts, create_time, update_time)
              VALUES (1, 'seed_user', 'seed_user@example.com', 'x', 1, 0, 0, NOW(), NOW())
              ON DUPLICATE KEY UPDATE id = id;" || true
          done
      - name: Migration history validation
        env:
          DATABASE_URL: mysql+pymysql://test_user:test_pw@127.0.0.1:3306/ai_testmaster
          TEST_DATABASE_URL: mysql+pymysql://test_user:test_pw@127.0.0.1:3306/ai_testmaster_test
        run: |
          python scripts/verify_migrations.py --check-downgrade
          python scripts/verify_migrations.py --full
      # 【必阻断】后端核心子集 —— 保留为**覆盖率门禁**（--cov-fail-under=80）：
      # 覆盖率需单进程统计，故仍由本 job 承担；全量回归由下方 backend-full 分片 job 承担。
      # 目录排除项说明：tests/regression 由 pr-regression.yml（快速）+ daily-regression.yml（全量）承担。
      - name: Backend pytest
        env:
          DATABASE_URL: mysql+pymysql://test_user:test_pw@127.0.0.1:3306/ai_testmaster
          TEST_DATABASE_URL: mysql+pymysql://test_user:test_pw@127.0.0.1:3306/ai_testmaster_test
        run: |
          # 覆盖率门槛按「本子集可达到的水平」设棘轮：`--cov=app` 统计的是全 app（47675 条语句），
          # 而本 job 只跑 5 个目录（实测 TOTAL 66%，2026-11-23），80% 在结构上不可达 —— 全量由
          # backend-full 4 分片承担。此处取 65 防回退（实测 66%），后续随测试补齐逐步上调。
          pytest tests/api tests/crud tests/models tests/schemas tests/services \
            --tb=short --cov=app --cov-fail-under=65 -q

  # ── 【必阻断】后端全量测试（B-06，2026-11-12）──
  # 判据：全量纳入 CI 且测试步骤 wall time < 10 分钟。
  # 实现选择：pytest-split 按 `.test_durations` 时长权重切 4 片并行 job（单片实测 ≈ 5 分钟）。
  #
  # ❗为什么不用 pytest-xdist `-n auto`（已实测，勿重复尝试）：
  #   测试共享同一个 MySQL 库，多进程并发会互相制造行锁/死锁；MySQL 在事务被回滚后
  #   会销毁 SAVEPOINT，表现为大量 `(1305) SAVEPOINT sa_savepoint_1 does not exist`。
  #   实测 12 worker：11 failed / 106 errors / 5:35；`--dist loadfile` 仍有 6 failed / 78 errors。
  #   单 worker（-n 1）与串行结果完全一致（244 passed），确认根因是**跨进程共享库**而非用例本身。
  #   彻底解法需 per-worker 独立库（CI 的 test_user 无 CREATE DATABASE 权限）或让异步用例
  #   全部走同一事务 fixture（大改测试基建），故本波采用「同库 + 分片串行」。
  backend-full:
    name: backend-full (shard ${{ matrix.group }}/4)
    # 同 backend-test：钉 24.04 以规避 Playwright 不支持 ubuntu26.04 的浏览器安装
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_pw
          # 应用库（与本地 .env 语义一致）；测试库由 Init 步骤创建 —— 多个用例用
          # `settings.DATABASE_URL.replace("/ai_testmaster", "/ai_testmaster_test")` 推导测试库，
          # 若 DATABASE_URL 直接指向 _test 会拼出 `..._test_test`（1049 Unknown database）
          MYSQL_DATABASE: ai_testmaster
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        # 限流 / 缓存 / SSE 用例依赖真实 Redis；缺失时会 ConnectionRefused (6379) 批量失败
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-split
      - name: Install Playwright browsers
        # 同 backend-test：浏览器控制器用例需要 chromium
        run: playwright install --with-deps chromium
      - name: Init test database
        env:
          MYSQL_PWD: test_root_pw
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -e "
            CREATE DATABASE IF NOT EXISTS ai_testmaster_test
              CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            GRANT ALL PRIVILEGES ON ai_testmaster_test.* TO 'test_user'@'%';
            FLUSH PRIVILEGES;"
      - name: Alembic migrations
        # 应用库与测试库都要建到 head（见 backend-test 同名步骤说明）
        run: |
          DATABASE_URL=mysql+pymysql://test_user:test_pw@127.0.0.1:3306/ai_testmaster \
            alembic upgrade head
          DATABASE_URL=mysql+pymysql://test_user:test_pw@127.0.0.1:3306/ai_testmaster_test \
            alembic upgrade head
      - name: Seed default user
        # 同 backend-test：补齐 id=1 占位用户，避免遗留用例 1452
        env:
          MYSQL_PWD: test_root_pw
        run: |
          for db in ai_testmaster ai_testmaster_test; do
            mysql -h 127.0.0.1 -P 3306 -u root "$db" -e "
              INSERT INTO users (id, username, email, password_hash, is_active, is_superuser,
                                 failed_login_attempts, create_time, update_time)
              VALUES (1, 'seed_user', 'seed_user@example.com', 'x', 1, 0, 0, NOW(), NOW())
              ON DUPLICATE KEY UPDATE id = id;" || true
          done
      - name: Backend pytest (shard ${{ matrix.group }}/4)
        env:
          DATABASE_URL: mysql+pymysql://test_user:test_pw@127.0.0.1:3306/ai_testmaster
          TEST_DATABASE_URL: mysql+pymysql://test_user:test_pw@127.0.0.1:3306/ai_testmaster_test
        run: |
          pytest tests -q --tb=short \
            --splits 4 --group ${{ matrix.group }}

  # 【必阻断】部署编排校验（R5-1 阶段二，2026-11-11）
  # 目的：executor 服务的增删/命令变更属于部署级改动，用 compose 解析做静态门禁，
  # 避免「代码合入但 compose 语法/服务缺失」的回归。运行时扩容（--scale）在 K4 人工验收。
  compose-config:
    runs-on: ubuntu-latest
    env:
      # docker-compose.yml 用 `${VAR:?}` 强制必填；CI 无 .env，这里只提供校验用占位值，
      # 不参与任何实际启动，避免「compose 校验永远因缺环境变量而红」。
      MYSQL_ROOT_PASSWORD: ci-placeholder-root
      MYSQL_PASSWORD: ci-placeholder-user
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config -q
      - name: Assert executor service wiring
        run: |
          docker compose -f docker-compose.yml config --services | grep -qx executor
          docker compose -f docker-compose.yml config | grep -q "scripts/run_executor.py"
          docker compose -f docker-compose.yml config | grep -q 'EXECUTOR_MODE: worker'

  # 【必阻断】前端门禁：ESLint → vue-tsc 类型检查 → 构建 → 单测
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      # 单测 + 覆盖率门槛（scripts/check-coverage.mjs），不达标即失败
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
