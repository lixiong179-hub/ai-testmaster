name: PR Fast Regression

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pytest.ini'

jobs:
  fast-regression:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_pw
          MYSQL_DATABASE: ai_testmaster_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run Alembic migrations
        env:
          DATABASE_URL: mysql+pymysql://test_user:test_pw@127.0.0.1:3306/ai_testmaster_test
        run: |
          alembic upgrade head

      - name: Run scenario 1/2 regression (fast)
        env:
          TEST_DATABASE_URL: mysql+pymysql://test_user:test_pw@127.0.0.1:3306/ai_testmaster_test
        run: |
          pytest tests/regression/test_scenario_1.py tests/regression/test_scenario_2.py \
            -v --tb=short -m "regression and scenario_fast" \
            --cov=app.pipelines --cov=app.services \
            --cov-fail-under=50

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-regression-results
          path: .coverage
