[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -o console_output_encoding=utf-8 -m "not real_browser and not real_api" --cov=app --cov-branch --cov-fail-under=25 --cov-report=term-missing
asyncio_mode = auto
markers =
    unit: 单元测试
    integration: 集成测试
    api: API测试
    slow: 慢速测试
    real_browser: 需要真实浏览器的测试
    real_api: 需要真实API调用的测试
filterwarnings =
    ignore::DeprecationWarning
collect_ignore_glob = tests/test_browser_*.py tests/test_element_locator_*.py tests/test_execution_engine_*.py
