[pytest]
testpaths = tests
# 让 `pytest`（console script）也能 import 仓库根的 `app` 包；此前只有 `python -m pytest` 可用，
# 导致 CI 直接调用 `pytest tests/...` 时 conftest 报 ModuleNotFoundError: No module named 'app'
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -o console_output_encoding=utf-8 -m "not real_browser and not real_api"
asyncio_mode = auto
markers =
    unit: 单元测试
    integration: 集成测试
    api: API测试
    slow: 慢速测试
    real_browser: 需要真实浏览器的测试
    real_api: 需要真实API调用的测试
    regression: Pipeline 回归测试
    scenario_fast: 场景 1/2 快速回归
    scenario_full: 场景 3/4/5 完整回归
filterwarnings =
    ignore::DeprecationWarning
