[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -o console_output_encoding=utf-8 -m "not real_browser and not real_api" --ignore-glob=tests/test_browser_*.py --ignore-glob=tests/test_element_locator_*.py --ignore-glob=tests/test_execution_engine_*.py
asyncio_mode = auto
markers =
    unit: 单元测试
    integration: 集成测试
    api: API测试
    slow: 慢速测试
    real_browser: 需要真实浏览器的测试
    real_api: 需要真实API调用的测试
    regression: Pipeline 回归测试
    scenario_fast: 场景 1/2 快速回归
    scenario_full: 场景 3/4/5 完整回归
filterwarnings =
    ignore::DeprecationWarning
