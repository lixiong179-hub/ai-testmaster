# AI TestMaster 非敏感配置
# 业务用途：存放可明文配置的环境变量，敏感信息放 secret.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-testmaster-config
  namespace: ai-testmaster
  labels:
    app.kubernetes.io/part-of: ai-testmaster
data:
  ENVIRONMENT: "prod"
  APP_NAME: "AI测试平台"
  DEBUG: "false"
  # 数据库连接（host 由 service 名解析）
  DB_POOL_SIZE: "20"
  DB_POOL_TIMEOUT: "30"
  DB_MAX_OVERFLOW: "10"
  DB_SYNC_POOL_SIZE: "5"
  DB_SYNC_MAX_OVERFLOW: "5"
  DB_ASYNC_POOL_SIZE: "20"
  DB_ASYNC_MAX_OVERFLOW: "10"
  # Redis
  REDIS_MAX_CONNECTIONS: "50"
  # JWT
  JWT_ALGORITHM: "RS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
  # AI 配置
  AI_BASE_URL: "https://api.deepseek.com"
  AI_MODEL_NAME: "deepseek-v4-flash"
  AI_FALLBACK_MODEL_NAME: "deepseek-v4-flash"
  VISION_MODEL_DEFAULT: "qwen"
  # AI 自愈
  AI_SELF_HEALING_ENABLED: "true"
  AI_AGENT_ENABLED: "true"
  AI_AGENT_TOKEN_LIMIT: "4000"
  AI_AGENT_DAILY_TOKEN_BUDGET: "1000000"
  AI_AGENT_MAX_ITERATIONS: "20"
  AI_AGENT_LOOP_DETECTION_THRESHOLD: "3"
  AI_AGENT_CIRCUIT_BREAKER_THRESHOLD: "5"
  AI_AGENT_CIRCUIT_BREAKER_RECOVERY_SECONDS: "300"
  AI_AGENT_HISTORY_MESSAGE_COUNT: "10"
  AI_AGENT_MCP_SERVER_ENABLED: "true"
  # CORS
  CORS_ORIGINS: "https://testmaster.example.com"
  CORS_ALLOW_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
  CORS_ALLOW_CREDENTIALS: "true"
  CORS_ALLOW_HEADERS: "Authorization,Content-Type,Accept,Origin,X-Requested-With,X-CSRF-Token,X-Request-ID"
  # 日志
  LOG_LEVEL: "WARNING"
  # 对象存储（Phase 1 Task 1）
  STORAGE_BACKEND: "s3"
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_REGION: "us-east-1"
  S3_USE_SSL: "false"
  S3_BUCKET: "ai-testmaster-uploads"
