# AI TestMaster 敏感配置
# 部署前必须替换 <PLACEHOLDER> 占位符，禁止直接提交真实凭据
# 生产环境建议通过 sealed-secrets / external-secrets 注入
apiVersion: v1
kind: Secret
metadata:
  name: ai-testmaster-secret
  namespace: ai-testmaster
  labels:
    app.kubernetes.io/part-of: ai-testmaster
type: Opaque
stringData:
  # 数据库
  MYSQL_ROOT_PASSWORD: "<PLACEHOLDER_REPLACE_ME>"
  MYSQL_DATABASE: "ai_testmaster"
  MYSQL_USER: "aitest"
  MYSQL_PASSWORD: "<PLACEHOLDER_REPLACE_ME>"
  DATABASE_URL: "mysql+aiomysql://aitest:<PLACEHOLDER_REPLACE_ME>@mysql-primary:3306/ai_testmaster"
  DATABASE_REPLICA_URL: "mysql+aiomysql://aitest:<PLACEHOLDER_REPLACE_ME>@mysql-replica:3306/ai_testmaster"
  # Redis
  REDIS_URL: "redis://redis:6379/0"
  # JWT（RS256 模式使用 RSA 密钥对，HS256 兼容期使用 secret key）
  JWT_SECRET_KEY: "<PLACEHOLDER_REPLACE_ME>"
  JWT_PRIVATE_KEY: "<PLACEHOLDER_RSA_PRIVATE_KEY_PEM>"
  JWT_PUBLIC_KEY: "<PLACEHOLDER_RSA_PUBLIC_KEY_PEM>"
  # 加密
  ENCRYPTION_KEY: "<PLACEHOLDER_REPLACE_ME>"
  ENCRYPTION_SALT: "<PLACEHOLDER_REPLACE_ME>"
  # 管理员初始密码（首次启动后立即修改）
  ADMIN_INITIAL_PASSWORD: "<PLACEHOLDER_REPLACE_ME>"
  # AI 配置
  AI_API_KEY: "<PLACEHOLDER_REPLACE_ME>"
  # 视觉模型 API Key
  KIMI_API_KEY: "<PLACEHOLDER_REPLACE_ME>"
  QWEN_API_KEY: "<PLACEHOLDER_REPLACE_ME>"
  ZHIPU_API_KEY: "<PLACEHOLDER_REPLACE_ME>"
  BAIDU_API_KEY: "<PLACEHOLDER_REPLACE_ME>"
  DOUBAO_API_KEY: "<PLACEHOLDER_REPLACE_ME>"
  # Browserbase
  BROWSERBASE_API_KEY: "<PLACEHOLDER_REPLACE_ME>"
  BROWSERBASE_PROJECT_ID: "<PLACEHOLDER_REPLACE_ME>"
  # 对象存储
  S3_ACCESS_KEY: "<PLACEHOLDER_REPLACE_ME>"
  S3_SECRET_KEY: "<PLACEHOLDER_REPLACE_ME>"
