# MySQL 主从复制初始化 Job（Phase 1 Task 2 读写分离前置）
# 业务用途：自动化建立主从复制关系，避免人工操作
# 设计说明：
#   - Job 一次性运行，初始化复制用户并建立复制关系
#   - 使用 mysql:8.0 客户端镜像，无需额外依赖
#   - 失败时通过 restartPolicy: OnFailure 自动重试
#   - 生产环境建议使用 MySQL Operator 自动化复制管理
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-replication-init
  namespace: ai-testmaster
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: replication-init
spec:
  backoffLimit: 5
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/component: replication-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: replication-init
          image: mysql:8.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "[1/3] 等待主库就绪..."
              until mysqladmin ping -h mysql-primary -uroot -p"$MYSQL_ROOT_PASSWORD" --silent; do
                echo "  主库未就绪，5s 后重试..."
                sleep 5
              done

              echo "[2/3] 在主库创建复制用户（若不存在）..."
              # 安全说明：复制密码通过 K8s Secret（ai-testmaster-secret）的 MYSQL_REPL_PASSWORD key 注入，
              # 禁止硬编码。heredoc 使用未引用定界符 <<SQL 以允许变量展开。
              mysql -h mysql-primary -uroot -p"$MYSQL_ROOT_PASSWORD" <<SQL || true
              CREATE USER IF NOT EXISTS 'repl'@'%' IDENTIFIED BY '${MYSQL_REPL_PASSWORD}';
              ALTER USER 'repl'@'%' IDENTIFIED BY '${MYSQL_REPL_PASSWORD}';
              GRANT REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO 'repl'@'%';
              FLUSH PRIVILEGES;
              SQL

              echo "[3/3] 在从库建立复制关系并启动..."
              # 重置从库的复制配置（幂等）
              mysql -h mysql-replica -uroot -p"$MYSQL_ROOT_PASSWORD" <<SQL || true
              STOP REPLICA;
              RESET REPLICA ALL;
              CHANGE REPLICATION SOURCE TO
                SOURCE_HOST='mysql-primary',
                SOURCE_PORT=3306,
                SOURCE_USER='repl',
                SOURCE_PASSWORD='${MYSQL_REPL_PASSWORD}',
                SOURCE_AUTO_POSITION=1,
                GET_SOURCE_PUBLIC_KEY=1;
              START REPLICA;
              SQL

              echo "[完成] 主从复制初始化成功"
              # 验证复制状态
              sleep 5
              mysql -h mysql-replica -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SHOW REPLICA STATUS\G" | grep -E "Replica_IO_Running|Replica_SQL_Running|Seconds_Behind_Source"
          envFrom:
            - secretRef:
                name: ai-testmaster-secret
---
# Prometheus mysql_exporter ServiceMonitor（Phase 1 Task 2 主从延迟监控）
# 业务用途：采集 Seconds_Behind_Master 指标，触发告警与自动降级
# 设计说明：
#   - 部署 mysql_exporter sidecar 至 mysql-replica StatefulSet
#   - 暴露 9104 端口供 Prometheus 抓取
#   - 告警规则：replication_lag > 0.5s 告警，> 2s 触发自动降级
apiVersion: v1
kind: Service
metadata:
  name: mysql-replica-exporter
  namespace: ai-testmaster
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: replica-exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: replica
  ports:
    - name: metrics
      port: 9104
      targetPort: 9104
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mysql-replica-monitor
  namespace: ai-testmaster
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
      app.kubernetes.io/component: replica-exporter
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
