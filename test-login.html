<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #409eff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #66b1ff;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            background-color: #f5f7fa;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success {
            background-color: #f0f9eb;
            border: 1px solid #67c23a;
        }
        .error {
            background-color: #fef0f0;
            border: 1px solid #f56c6c;
        }
    </style>
</head>
<body>
    <h1>AI TestMaster 登录测试</h1>
    
    <div class="form-group">
        <label for="username">用户名:</label>
        <input type="text" id="username" value="admin">
    </div>
    
    <div class="form-group">
        <label for="password">密码:</label>
        <input type="password" id="password" value="password123">
    </div>
    
    <button onclick="testLogin()">测试登录</button>
    
    <div id="result" class="result" style="display: none;"></div>

    <script>
        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.textContent = '正在发送登录请求...';
            
            try {
                const response = await fetch('http://localhost:8001/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                console.log('登录响应:', data);
                
                if (data.code === 200 && data.data && data.data.access_token) {
                    // 存储token
                    localStorage.setItem('token', data.data.access_token);
                    
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>登录成功!</strong>
                        <br>Token: ${data.data.access_token}
                        <br>已存储到localStorage
                        <br><br>
                        <button onclick="visitHome()">访问首页</button>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <strong>登录失败!</strong>
                        <br>响应: ${JSON.stringify(data, null, 2)}
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <strong>请求失败!</strong>
                    <br>错误: ${error.message}
                    <br><br>
                    <strong>可能的原因:</strong>
                    <br>1. 后端服务未启动 (请确保运行: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload)
                    <br>2. CORS策略阻止了跨域请求
                    <br>3. 网络连接问题
                    <br><br>
                    <strong>建议:</strong>
                    <br>请直接访问 <a href="http://localhost:3000/login" target="_blank">http://localhost:3000/login</a> 进行测试
                `;
            }
        }
        
        function visitHome() {
            // 在新窗口中打开首页
            window.open('http://localhost:3000/home', '_blank');
        }
    </script>
</body>
</html>
