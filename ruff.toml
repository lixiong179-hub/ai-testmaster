# Ruff 配置（B-05：迁移至 [lint] 段 + 历史欠账分级豁免；2026-11-12 门禁归零）
#
# 背景：`ci.yml` 的 `ruff check app` 是必阻断门禁，但自建立起长期为红（初测 6534 errors），
# 导致该门禁失去信号价值（与前端 G-6 同性质）。
#
# 现状（🧪 实测）：`ruff check app` → All checks passed（0 error），
# 类型标注现代化 UP006/UP045/UP035 与风格类 SIM*/UP* 已全部清零。
# 目前仅保留 4 条按规则粒度的豁免，逐条登记理由与实测数量。
#
# ⚠️ 禁止在本仓库执行 `ruff check app --fix` 全仓自动修复：
#   实测 safe/unsafe fix 均会删除 re-export 转发符号（如 app/crud/iteration.py 的
#   `_normalize_iteration_name`、app/core/config.py 的 `_generate_secret_key`、兼容层
#   app/pipelines/steps/case_generation.py 的 `_build_full_prompt` 等），导致
#   `import app.main` 或测试收集直接失败。代码级治理必须逐文件 + 逐规则进行，
#   并跑「全模块导入冒烟 + pytest 收集 + 全量测试」三段回归。

line-length = 120
# target-version 与运行时/CI 对齐（Python 3.11）：UP045/UP035 的修复依赖该声明。
# 由此新增的 UP042(StrEnum)/UP041(TimeoutError)/UP017(datetime.UTC) 已一并清理。
target-version = "py311"

[lint]
select = ["F", "E", "W", "C90", "SIM", "UP"]
ignore = [
    # 行宽由 line-length 控制，保留历史行为
    "E501",

    # --- 仅存的历史欠账豁免（治理任务 G-8，须重构/人工甄别，非格式问题）---
    # 函数复杂度（150 处 > 10）：须拆分函数而非抑制。
    "C901",
    # 模块级导入不在文件顶部（88 处）：R4-7 消环引入的延迟导入，属有意为之。
    "E402",
]

[lint.mccabe]
max-complexity = 10

[lint.per-file-ignores]
# 包聚合文件天然用于 re-export
"__init__.py" = ["F401"]

# 格式化（B-15，2026-11-18 全仓归零）：
# `ruff format app tests scripts` 已将 1210 文件重排完毕，现 `ruff format --check` 全绿
# （app/tests/scripts 共 1370 文件 already formatted）。历史上因 R2-1 在途大 diff 而排除，
# 该前置已解除。⚠️ `alembic/versions` 未格式化（冻结的迁移历史，CI 另有迁移校验），勿随手 format。
# 已升为 ci.yml 必阻断步骤：`backend-test` 的 `Ruff format check`（`ruff format --check app`，
# 紧随 `Ruff lint`）。ruff 在该 job 的 Install 步骤钉 `==0.15.17`——fmt 风格随版本演进，
# 浮动版本会让全量 PR 无故变红；升级 ruff 时须先本地全量 format 并单独提交。
